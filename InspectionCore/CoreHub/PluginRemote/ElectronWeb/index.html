<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Plugin Remote Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .status-bar {
      background-color: #3498db;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 10px;
    }
    
    .connected {
      background-color: #2ecc71;
    }
    
    .disconnected {
      background-color: #e74c3c;
    }
    
    .message-container {
      background-color: white;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 20px;
      height: 400px;
      overflow-y: auto;
    }
    
    .message {
      padding: 10px;
      margin-bottom: 10px;
      border-left: 4px solid #3498db;
      background-color: #f9f9f9;
    }
    
    .message-time {
      color: #7f8c8d;
      font-size: 0.8em;
      margin-bottom: 5px;
    }
    
    .message-content {
      word-break: break-word;
    }
    
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
    
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #2980b9;
    }
    
    button:active {
      background-color: #1f6aa5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Plugin Remote Viewer</h1>
    
    <div class="status-bar">
      <div>
        <span class="status-indicator disconnected" id="status-indicator"></span>
        <span id="connection-status">Disconnected</span>
      </div>
      <div id="message-count">0 messages received</div>
    </div>
    
    <div class="message-container" id="message-container">
      <!-- Messages will be added here dynamically -->
    </div>
    
    <div class="controls">
      <button id="clear-button">Clear Messages</button>
    </div>
  </div>
  
  <script>
    // Variables to track connection status and message count
    let isConnected = false;
    let messageCount = 0;
    let lastMessageTime = 0;
    
    // DOM elements
    const statusIndicator = document.getElementById('status-indicator');
    const connectionStatus = document.getElementById('connection-status');
    const messageCountElement = document.getElementById('message-count');
    const messageContainer = document.getElementById('message-container');
    const clearButton = document.getElementById('clear-button');
    
    // Function to update connection status
    function updateConnectionStatus(connected) {
      isConnected = connected;
      
      if (connected) {
        statusIndicator.classList.remove('disconnected');
        statusIndicator.classList.add('connected');
        connectionStatus.textContent = 'Connected';
      } else {
        statusIndicator.classList.remove('connected');
        statusIndicator.classList.add('disconnected');
        connectionStatus.textContent = 'Disconnected';
      }
    }
    
    // Function to add a message to the container
    function addMessage(message) {
      const now = new Date();
      lastMessageTime = now.getTime();
      
      // Create message elements
      const messageElement = document.createElement('div');
      messageElement.className = 'message';
      
      const timeElement = document.createElement('div');
      timeElement.className = 'message-time';
      timeElement.textContent = now.toLocaleTimeString();
      
      const contentElement = document.createElement('div');
      contentElement.className = 'message-content';
      contentElement.textContent = message;
      
      // Append elements
      messageElement.appendChild(timeElement);
      messageElement.appendChild(contentElement);
      messageContainer.appendChild(messageElement);
      
      // Scroll to bottom
      messageContainer.scrollTop = messageContainer.scrollHeight;
      
      // Update message count
      messageCount++;
      messageCountElement.textContent = `${messageCount} messages received`;
      
      // Update connection status
      updateConnectionStatus(true);
      
      // Set a timeout to mark as disconnected if no messages received for 5 seconds
      setTimeout(() => {
        const currentTime = new Date().getTime();
        if (currentTime - lastMessageTime > 5000) {
          updateConnectionStatus(false);
        }
      }, 5000);
    }
    
    // Function to clear all messages
    function clearMessages() {
      messageContainer.innerHTML = '';
      messageCount = 0;
      messageCountElement.textContent = '0 messages received';
    }
    
    // Set up event listeners
    clearButton.addEventListener('click', () => {
      clearMessages();
      window.ipcRenderer.send('clear-messages');
    });
    
    // Listen for messages from the main process
    window.ipcRenderer.on('shared-memory-message', (event, message) => {
      addMessage(message);
    });
    
    // Listen for clear messages command
    window.ipcRenderer.on('clear-messages', () => {
      clearMessages();
    });
    
    // Initialize as disconnected
    updateConnectionStatus(false);
  </script>
</body>
</html>
