; Standalone trigger-pin test firmware. Flashing this REPLACES the machine
; firmware on the board -- reflash the real one from Peripheral/uInspESP32
; (`pio run -t upload`) when finished.
;
; Same platform/board/speed as the machine firmware so the toolchain it pulls is
; the one already on this PC.
[env:esp32dev]
platform = espressif32@5.1.0
board = esp32dev
board_build.f_cpu = 240000000L
framework = arduino
upload_speed = 921600
monitor_speed = 115200
