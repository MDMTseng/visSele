  function createBlock(pointA,pointB, thickness=20)
  {

    // calculate the length of the rod (distance between A and B)
    const length = Math.sqrt(Math.pow(pointB.x - pointA.x, 2) + Math.pow(pointB.y - pointA.y, 2));

    // calculate the angle of the rod (angle with the horizontal)
    const angle = Math.atan2(pointB.y - pointA.y, pointB.x - pointA.x);

    // calculate the midpoint for the rod's position
    const midPointX = (pointA.x + pointB.x) / 2;
    const midPointY = (pointA.y + pointB.y) / 2;


    // create the rod
    const block = Bodies.rectangle(midPointX, midPointY, length, thickness, {
      frictionAir: 0.01,
        angle: angle
    });
    return block
  }

        stiffness: stiffness,
        angleAStiffness: 1,
        angleBStiffness: 1,
  
        //hide the stick
        render:{...renderProp}
        
    });
  
    World.add(world, stick);
  
    return stick;

  <script>
  function modifyAllRodProperties(scaleFactor) {
    const baseMass = 0.0001; // Base mass value
    const baseStiffness = 0.1; // Base stiffness value
    
    for(let i = 0; i < engine.world.bodies.length; i++) {
        let body = engine.world.bodies[i];
        // Only modify non-static bodies
        if (!body.isStatic) {
            // Scale mass proportionally
            let newMass = baseMass * scaleFactor;
            Body.setMass(body, newMass);
            Body.setInertia(body, newMass * body.area);
        }
    }

    // Update all constraints
    for(let i = 0; i < engine.world.constraints.length; i++) {
        let constraint = engine.world.constraints[i];
        // Scale stiffness proportionally
        constraint.stiffness = baseStiffness * scaleFactor;
        // Adjust damping to maintain stability
        constraint.damping = 0.1 * Math.sqrt(scaleFactor);
    }
  }
  </script>

  <script>
  function adjustDamping(value) {
    const dampingValue = value / 100; // Convert to 0-1 range
    
    // Update all constraints
    for(let i = 0; i < engine.world.constraints.length; i++) {
        let constraint = engine.world.constraints[i];
        constraint.damping = dampingValue;
    }
    
    // Update display value
    document.getElementById('dampingValue').textContent = dampingValue.toFixed(2);
  }

  function adjustStiffness(value) {
    const stiffnessValue = value / 100; // Convert to 0-1 range
    
    // Update all constraints
    for(let i = 0; i < engine.world.constraints.length; i++) {
        let constraint = engine.world.constraints[i];
        constraint.stiffness = stiffnessValue;
    }
    
    // Update display value
    document.getElementById('stiffnessValue').textContent = stiffnessValue.toFixed(2);
  }
