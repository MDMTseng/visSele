; PlatformIO Project Configuration File for STM32
; This is a template configuration for STM32 support
; 
; STATUS: PLANNED - NOT IMPLEMENTED
; This file would be used when STM32 support is implemented

[platformio]
src_dir = ./
build_src_filter = +<*> -<test/> -<test_temp/>

[env:stm32f4]
; STM32F4 Discovery Board configuration
platform = ststm32
board = disco_f407vg
framework = stm32cube
board_build.f_cpu = 168000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
upload_speed = 921600
monitor_speed = 115200

; Build flags for STM32
build_flags = 
    -DTARGET_STM32=1
    -DSTM32F4=1
    -DCORE_DEBUG_LEVEL=0
    -O3
    -I src/protocol
    -I src/hal/stm32

; STM32-specific libraries (would be added when implementing)
lib_deps = 
    ; STM32 HAL libraries
    ; FreeRTOS for STM32
    ; JSON library compatible with STM32

